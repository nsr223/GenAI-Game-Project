# Deterministic interactions: conversation topics and evidence presentations.
# Free-text chat with an NPC never changes game state. State changes in conversations happen only
# through these entries, after the engine has checked their conditions (Evidence §6.2, §7.1, §7.4).
#
# Fields
#   id          stable snake_case ID
#   trigger     topic   -> offered as an "ask/request" action while `npc` is present
#               present -> fires when the player presents `evidence` to `npc`
#   label       player-facing text for topic buttons (topic only)
#   npc         NPC who must be in the player's current location
#   evidence    evidence ID that must be presented (present only)
#   requires    condition; if false the interaction is blocked and `blocked_text` is shown
#   effects     collect_evidence: [ids]   (each item's own access + prerequisites are also checked)
#               set_flags: [flags]
#               authorize_cabin: cabin_id (adds to private_cabin_search_authorized)
#               record_claim: {topic, text, tbd}   (claim is stored with speaker = npc and the turn)
#   result_text player-facing outcome text
#   blocked_text player-facing text when `requires` (or an evidence gate) fails
#   once        default true: effects apply only the first time; afterwards result_text is repeated
#               (and a successful `once` topic leaves the topic menu)
#   offered_when  topic only, default always: condition for the topic to appear in the menu. Once
#               it has appeared it stays. Use it so the player needs a reason before a request
#               shows up, e.g. {noticed: <object or location id>} (inspected it / tried to enter),
#               {mentioned: {npc, about: <keyword group>}} (the player's OWN words to that NPC;
#               NPC replies are never scanned) or {completed: <interaction id>}.
#   tbd, tbd_note  provisional fields
#
# DISCOVERY (PROPOSED): every `offered_when` below is a game-design proposal, not canon. Basic
# questions are offered from the start; requests and follow-ups appear once the player has found
# a reason. Marked `tbd: [offered_when]` so the story/evidence owners can review them.
#
# STUB REQUESTS: what actually makes Sarah (or Daniel/Lucas) grant each authorization is an open story
# decision (World §11 "What authorizes wet-lab and private-cabin searches", Evidence §12). Until it is
# decided these requests always succeed. They are marked `tbd: [requires]`.

# Words or phrases the player may use; matched case-insensitively as whole words ("M-17" -> "m 17").
keyword_groups:
  medical: [injury, injuries, wound, wounds, medical, examination, cause of death, autopsy, post mortem, body]
  wet_lab: [wet lab, wet laboratory, crime scene, the scene, where she died, where elena died]
  engineering_records: [record, records, log, logs, maintenance, terminal, apparatus, machine, machinery, fault, faults, service]
  project_records: [project records, project files, shared records, shared files, research data, data, files, workstation, m17, m 17]
  elena_cabin: [cabin, her room, elena s room, notes, her notes, elena s notes, belongings, her things]
  footage: [footage, film, filming, filmed, camera, cameras, video, videos, recording, recordings, recorded, clip, clips]

interactions:
  # ----------------------------------------------------------- Whereabouts (one per suspect)
  # Everyone gets the same basic question, so asking Maya is not singled out.
  - id: ask_maya_whereabouts
    trigger: topic
    label: Ask Maya where she was last night
    npc: maya_chen
    requires: {}
    effects:
      record_claim:
        topic: whereabouts_critical_window
        text: "[TBD] Maya's account of where she was during the evening."
        tbd: true
    result_text: Maya tells you where she says she was last night. You make a note of it.
    blocked_text: Maya doesn't answer.
    tbd: [effects]
    tbd_note: Maya's claimed alibi is TBD (Evidence §4.4 EV-19, docs/characters/maya_chen.md §9).

  - id: ask_daniel_whereabouts
    trigger: topic
    label: Ask Daniel where he was last night
    npc: daniel_reyes
    requires: {}
    effects:
      record_claim: {topic: whereabouts_critical_window, text: "[TBD] Daniel's account of the evening.", tbd: true}
    result_text: Daniel gives you his account of last night. You make a note of it.
    blocked_text: Daniel doesn't answer.
    tbd: [effects]
    tbd_note: Claimed whereabouts TBD; actual movements in Story §7.1 (feature/finalize-investigation).

