    blocked_text: Daniel won't show you the records.
    tbd: [requires, offered_when]
    tbd_note: When Daniel cooperates is TBD (see docs/characters/daniel_reyes.md §6).

  - id: request_shared_records_review
    trigger: topic
    label: Ask for access to the shared project records
    npc: sarah_morgan
    offered_when:
      any_of:
        - noticed: dry_lab_shared_workstation
        - mentioned: {npc: sarah_morgan, about: project_records}
    requires: {}
    effects:
      set_flags: [shared_project_records_access_granted]
    result_text: Sarah authorizes access to the shared project records for your audit.
    blocked_text: Sarah refuses for now.
    tbd: [npc, requires, offered_when]
    tbd_note: Provisional route to EV-16; placement and authorization TBD (Evidence §4.4, §12).

  - id: request_cabin_elena_search
    trigger: topic
    label: Ask to examine Elena's cabin to preserve her records
    npc: sarah_morgan
    offered_when:
      any_of:
        - noticed: cabin_elena         # tried the locked cabin door
        - mentioned: {npc: sarah_morgan, about: elena_cabin}
    requires: {}
    effects:
      authorize_cabin: cabin_elena
    result_text: Sarah gives you access to Elena's cabin to preserve her records.
    blocked_text: Sarah refuses for now.
    tbd: [requires, offered_when]
    tbd_note: Authorization for Elena's cabin and storage of her notes are TBD (World §3.6, Evidence §4.4).

  - id: ask_lucas_for_footage
    trigger: topic
