  # ----------------------------------------------------------- Olivia / medical chain
  - id: ask_olivia_initial_observations
    trigger: topic
    label: Ask about her initial observations
    npc: olivia_hart
    requires: {}
    effects:
      collect_evidence: [EV-10]
    result_text: Olivia shares what she can from her initial examination.
    blocked_text: Olivia can't share that right now.

  - id: discuss_reconstruction_with_olivia
    trigger: topic
    label: Compare the injury with the apparatus record
    npc: olivia_hart
    offered_when: {completed: ask_olivia_initial_observations}
    requires: medical_reconstruction_available
    effects:
      collect_evidence: [EV-11]
      set_flags: [medical_reconstruction_completed, machinery_cause_excluded]
    result_text: Olivia works through the comparison with you, step by step.
    # Re-check response, Evidence §6.5.
    blocked_text: >
      "I can't give you a reliable cause yet. We need to know exactly what that apparatus did, and compare
      it with the injuries. The initial scene isn't enough."
    tbd: [offered_when]
    tbd_note: Offered after Olivia's initial observations (PROPOSED discovery rule).

  - id: compare_injury_with_calibration_object
    trigger: topic
    label: Compare the injury with what you saw at the calibration station
    npc: olivia_hart
    # Hidden until both pieces exist: the label itself would point at the calibration station.
    offered_when:
      all_of:
        - evidence_collected: EV-11
        - evidence_collected: EV-13
    requires:
      all_of:
        - evidence_collected: EV-11
        - evidence_collected: EV-13
    effects:
      collect_evidence: [EV-14]
    result_text: Olivia compares the injury description with your notes from the wet lab.
    blocked_text: Olivia says she has nothing to compare that with yet.
    tbd: [requires, offered_when]
    tbd_note: Access protocol for the EV-14 comparison is TBD (Evidence §4.3). offered_when is PROPOSED.

  - id: request_medical_comparison
    trigger: topic
    label: Ask for a formal medical comparison to be authorized
    npc: sarah_morgan
    offered_when:
      any_of:
        - completed: ask_olivia_initial_observations
        - mentioned: {npc: sarah_morgan, about: medical}
    requires: {}
    effects:
      set_flags: [medical_comparison_authorized]
    result_text: Sarah authorizes Olivia to compare her findings with the technical records.
    blocked_text: Sarah isn't ready to authorize that.
    tbd: [npc, requires, offered_when]
    tbd_note: medical_comparison_authorized is a proposed flag; who grants it and why is TBD (Evidence §10.2).

  # ----------------------------------------------------------- Authorization stubs
