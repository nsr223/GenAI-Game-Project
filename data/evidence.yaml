        - daniel_shares_record
    prerequisites: {}
    player_visible_summary: >
      At 23:10 the sampling apparatus controller resumed an interrupted weekly verification task that had
      been left pending when automatic operation was restored. It was not the normal test day. The log
      records the retry only: the service cover has no position sensor, and no alert was generated.
    questions:
      - What did the apparatus physically do at 23:10?
    verified_facts: [apparatus_fault_2310_verified]
    not_established: [machinery_cause_excluded, exact_time_of_death_proven, elena_alive_at_2310]
    linked_characters: [daniel_reyes]
    linked_clues: [EV-10, EV-11]
    locked_hint: >
      The records are locked behind engineering credentials. The chief engineer could open them for you,
      or the captain could authorize a review.
    tbd: [object_id, locked_hint]
    tbd_note: Possibly mirrored at wet_lab_workstation (Evidence §4.2). locked_hint is PROPOSED wording.

