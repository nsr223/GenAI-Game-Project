# Evidence records (essential chain for the MVP).
# Source: Evidence Bible §4 (catalog), §5 (chains), §8.1 (access), §10.1 (record format).
# The bible is the source of truth; keep this file in sync through review.
#
# Fields (Evidence §10.1 plus engine additions)
#   id, slug, status, name         `name` and `player_visible_summary` are player-facing
#   location_id, object_id         where it is found (object_id may be null for testimony)
#   source_type                    document | machine_log | testimony | analysis | physical | recording | statement | memory
#   acquisition                    start      -> in the journal when the game begins
#                                  inspect    -> collected by inspecting object_id (if access + prerequisites pass)
#                                  interaction-> only granted by an interaction effect (data/interactions.yaml)
#   access, prerequisites          conditions, both checked whenever the item would be collected
#   player_visible_summary         the "Observed" text in the journal. No spoilers, no developer fields.
#   verified_facts, not_established  DEVELOPER ONLY. Never shown to players or put into NPC prompts.
#   linked_characters, linked_clues
#   questions                      optional player-facing follow-up questions for the journal
#   tbd, tbd_note                  provisional fields; see the PR description and Evidence §12

